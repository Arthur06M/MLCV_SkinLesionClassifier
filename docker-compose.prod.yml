services:
  skin-lesion-backend:
    image: skin-lesion-backend:latest
    container_name: skin-lesion-backend
    networks:
      - skin-lesion-network

  skin-lesion-frontend:
    image: skin-lesion-frontend:latest
    container_name: skin-lesion-frontend
    ports:
      - "3000:80"
    depends_on:
      - skin-lesion-backend
    networks:
      - skin-lesion-network

networks:
  skin-lesion-network:
    driver: bridge